[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dxf-to-3d-bim"
version = "0.1.0"
description = "Autonomous AI agent skill to transform 2D architectural DXF floor plans into semantically structured 3D BIM models using BIMCraft"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "DXF to 3D-BIM Maintainers" }
]
dependencies = [
    "ezdxf>=1.4.0",
    "shapely>=2.0.0",
    "pydantic>=2.10.0",
    "pillow>=10.0.0",
    "jsonschema>=4.20.0",
    "rich>=13.0.0",
    "typer>=0.12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0"
]

[project.scripts]
dxf-to-3d-bim = "dxf_to_3d_bim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

